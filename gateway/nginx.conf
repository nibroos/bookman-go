events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define upstreams for gRPC and HTTP REST
    # upstream grpc_service {
    #     server service:50051; # Docker service for gRPC
    # }

    upstream user_service {
        server user-service:4001; # Docker service for HTTP REST
    }

    upstream author_service {
        server author-service:4001; # Docker service for HTTP REST
    }

    upstream book_service {
        server book-service:4001; # Docker service for HTTP REST
    }

    upstream category_service {
        server category-service:4001; # Docker service for HTTP REST
    }

    # gRPC server
    # server {
    #     listen 50051 http2;
    #     location / {
    #         grpc_pass grpc://grpc_service;
    #         error_log /var/log/nginx/grpc_error.log debug;
    #     }
    # }

    # HTTP REST server
    server {
        listen 4011;
        location / {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 4012;
        location / {
            proxy_pass http://author_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 4013;
        location / {
            proxy_pass http://book_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 4014;
        location / {
            proxy_pass http://category_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}